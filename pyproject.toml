[project]
name = "dreamday-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.143.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py315"
line-length = 80
indent-width = 2

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Bugbear
    "UP",  # Modern Python syntax
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"