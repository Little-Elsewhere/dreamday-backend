[project]
name = "dreamday-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiosmtplib>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.0",
    "fastapi[standard]>=0.143.0",
    "PyJWT>=2.8.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.0.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "detect-secrets>=1.5.0",
    "httpx>=0.28.0",
    "import-linter>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_customize"
allowed_prefixes = [
  "Merge",
  "Revert",
  "Pull request",
  "fixup!",
  "squash!",
  "amend!",
]

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}{% if is_breaking_change %}!{% endif %}: {{message}}"
example = "feat(auth): add refresh token rotation"
schema = "<type>[optional scope][optional !]: <description>"
schema_pattern = "(feat|fix|perf|deps|revert|docs|style|refactor|test|build|ci|chore)(\\(.+\\))?(!)?:\\s.+"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change"
choices = [
  {value = "feat", name = "feat: A new feature"},
  {value = "fix", name = "fix: A bug fix"},
  {value = "perf", name = "perf: A performance improvement"},
  {value = "deps", name = "deps: A dependency update"},
  {value = "revert", name = "revert: Revert a previous commit"},
  {value = "docs", name = "docs: Documentation only"},
  {value = "style", name = "style: Formatting / style only"},
  {value = "refactor", name = "refactor: Neither fixes a bug nor adds a feature"},
  {value = "test", name = "test: Adding or correcting tests"},
  {value = "build", name = "build: Build system or packaging"},
  {value = "ci", name = "ci: CI configuration"},
  {value = "chore", name = "chore: Maintenance"},
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (optional, press enter to skip)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Commit description"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a breaking change?"
default = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-layers"
name = "Domain packages keep internal layering"
type = "layers"
containers = ["app.auth"]
layers = [
  "router",
  "dependencies",
  "service",
  "(email) | repositories",
  "models",
]

[[tool.importlinter.contracts]]
id = "auth-public-api"
name = "Other domains may only use auth.dependencies"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.health"]
forbidden_modules = [
  "app.auth.router",
  "app.auth.service",
  "app.auth.email",
  "app.auth.repositories",
  "app.auth.models",
  "app.auth.schemas",
  "app.auth.messages",
]
broken_contract_guidance = """
Cross-domain auth access must go through app.auth.dependencies
(for example CurrentUser). Do not import auth routers, services,
repositories, models, schemas, messages, or email helpers from
sibling domains.
"""

[[tool.importlinter.contracts]]
id = "api-mounts-routers-only"
name = "API aggregator may only mount domain routers"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.api"]
forbidden_modules = [
  "app.auth.dependencies",
  "app.auth.service",
  "app.auth.email",
  "app.auth.repositories",
  "app.auth.models",
  "app.auth.schemas",
  "app.auth.messages",
  "app.shared",
  "app.core",
]
broken_contract_guidance = """
app.api.router should only include_router(...) domain routers such as
app.auth.router and app.health.router.
"""

[[tool.importlinter.contracts]]
id = "no-fastapi-in-domain"
name = "Non-HTTP modules must not import FastAPI"
type = "forbidden"
source_modules = [
  "app.core",
  "app.auth.service",
  "app.auth.email",
  "app.auth.repositories",
  "app.auth.models",
  "app.auth.schemas",
  "app.auth.messages",
  "app.shared.responses",
]
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
id = "core-is-foundation"
name = "Core must not import application packages"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
  "app.api",
  "app.auth",
  "app.health",
  "app.shared",
]

[[tool.importlinter.contracts]]
id = "auth-schemas-pure"
name = "Auth schemas must stay free of ORM and application layers"
type = "forbidden"
source_modules = ["app.auth.schemas"]
forbidden_modules = [
  "app.api",
  "app.auth.router",
  "app.auth.dependencies",
  "app.auth.service",
  "app.auth.email",
  "app.auth.repositories",
  "app.auth.models",
  "app.auth.messages",
  "app.core",
  "app.health",
]

[[tool.importlinter.contracts]]
id = "auth-models-pure"
name = "Auth models must not import schemas or upper layers"
type = "forbidden"
source_modules = ["app.auth.models"]
forbidden_modules = [
  "app.api",
  "app.auth.router",
  "app.auth.dependencies",
  "app.auth.service",
  "app.auth.email",
  "app.auth.repositories",
  "app.auth.schemas",
  "app.auth.messages",
  "app.shared",
  "app.health",
]

[[tool.importlinter.contracts]]
id = "auth-repositories-boundaries"
name = "Auth repositories must not import HTTP or service layers"
type = "forbidden"
source_modules = ["app.auth.repositories"]
forbidden_modules = [
  "app.api",
  "app.auth.router",
  "app.auth.dependencies",
  "app.auth.service",
  "app.auth.email",
  "app.auth.schemas",
  "app.auth.messages",
  "app.shared",
  "app.health",
]

[[tool.importlinter.contracts]]
id = "shared-is-kernel"
name = "Shared must not import domain packages"
type = "forbidden"
source_modules = ["app.shared"]
forbidden_modules = [
  "app.api",
  "app.auth",
  "app.health",
]

[tool.ruff]
target-version = "py315"
line-length = 80
indent-width = 2

[tool.ruff.lint]
select = [
    "E4",  # Import errors
    "E7",  # Statement errors
    "E9",  # Syntax errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "B",   # Bugbear
    "UP",  # Modern Python syntax
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
